<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الوقت المتبقي لرجوع رنا</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌙</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@200;300;500&family=Reem+Kufi:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0E1422;
    --ink-2: #1A2234;
    --line: #2B3548;
    --moon: #E9DDBE;
    --mist: #8C96A8;
    --text: #EDEFF4;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--ink);
    color: var(--text);
    font-family: "Readex Pro", "Segoe UI", Tahoma, sans-serif;
    display: grid;
    place-items: center;
    padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
    overflow: hidden;
  }
  main { width: 100%; max-width: 560px; text-align: center; }

  h1 {
    font-family: "Reem Kufi", "Readex Pro", sans-serif;
    font-weight: 500;
    font-size: clamp(1.3rem, 4.5vw, 1.75rem);
    color: var(--moon);
    margin-bottom: 3rem;
  }

  .days {
    font-weight: 200;
    font-size: clamp(6rem, 30vw, 11rem);
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .days-label { color: var(--mist); font-weight: 300; font-size: 1.1rem; margin-top: .5rem; }

  .clock {
    display: flex;
    justify-content: center;
    gap: 2rem;
    margin-top: 2.5rem;
    font-weight: 300;
  }
  .clock div { min-width: 4ch; }
  .clock b {
    display: block;
    font-weight: 300;
    font-size: clamp(1.8rem, 7vw, 2.4rem);
    font-variant-numeric: tabular-nums;
  }
  .clock span { color: var(--mist); font-size: .85rem; }

  .moons {
    display: flex;
    justify-content: center;
    gap: 1.6rem;
    margin-top: 3.5rem;
    list-style: none;
  }
  .moons li { display: flex; flex-direction: column; align-items: center; gap: .6rem; }
  .moon {
    width: 34px; height: 34px; border-radius: 50%;
    border: 1px solid var(--line);
    background: linear-gradient(to left, var(--moon) var(--p, 0%), var(--ink-2) var(--p, 0%));
    transition: background 1s linear;
  }
  .moons small { color: var(--mist); font-size: .75rem; }

  .date { margin-top: 3rem; color: var(--mist); font-size: .9rem; font-weight: 300; }

  .done { display: none; }
  body.arrived .counting { display: none; }
  body.arrived .done { display: block; }
  .done p {
    font-family: "Reem Kufi", "Readex Pro", sans-serif;
    font-size: clamp(3rem, 14vw, 5.5rem);
    color: var(--moon);
  }

  canvas { position: fixed; inset: 0; pointer-events: none; }
</style>
</head>
<body>
<canvas id="confetti"></canvas>
<main>
  <div class="counting">
    <h1>الوقت المتبقي لرجوع رنا</h1>
    <div class="days" id="d">٠</div>
    <div class="days-label">يوم</div>
    <div class="clock" aria-live="off">
      <div><b id="h">٠٠</b><span>ساعة</span></div>
      <div><b id="m">٠٠</b><span>دقيقة</span></div>
      <div><b id="s">٠٠</b><span>ثانية</span></div>
    </div>
    <ol class="moons" id="moons" aria-label="الشهور الأربعة"></ol>
    <p class="date">الإثنين ١٨ يناير ٢٠٢٧</p>
  </div>
  <div class="done"><p>رنا رجعت 🎉</p></div>
</main>

<script>
  // Cairo is UTC+2 in Sep–Jan (no DST)
  const START  = new Date("2026-09-18T00:00:00+02:00");
  const TARGET = new Date("2027-01-18T00:00:00+02:00");
  const MONTHS = [
    ["2026-09-18", "2026-10-18", "أكتوبر"],
    ["2026-10-18", "2026-11-18", "نوفمبر"],
    ["2026-11-18", "2026-12-18", "ديسمبر"],
    ["2026-12-18", "2027-01-18", "يناير"]
  ].map(([a, b, n]) => ({ a: new Date(a + "T00:00:00+02:00"), b: new Date(b + "T00:00:00+02:00"), n }));

  const ar = n => n.toLocaleString("ar-EG", { useGrouping: false });
  const pad = n => ar(n).padStart(2, "٠");
  const $ = id => document.getElementById(id);

  const moonsEl = $("moons");
  MONTHS.forEach(mo => {
    const li = document.createElement("li");
    li.innerHTML = `<div class="moon"></div><small>${mo.n}</small>`;
    moonsEl.appendChild(li);
    mo.el = li.firstChild;
  });

  let arrived = false;
  function tick() {
    const now = Date.now();
    const diff = TARGET - now;
    if (diff <= 0) {
      if (!arrived) { arrived = true; document.body.classList.add("arrived"); confetti(); }
      return;
    }
    const t = Math.floor(diff / 1000);
    $("d").textContent = ar(Math.floor(t / 86400));
    $("h").textContent = pad(Math.floor(t % 86400 / 3600));
    $("m").textContent = pad(Math.floor(t % 3600 / 60));
    $("s").textContent = pad(t % 60);
    MONTHS.forEach(mo => {
      const p = Math.min(1, Math.max(0, (now - mo.a) / (mo.b - mo.a)));
      mo.el.style.setProperty("--p", (p * 100).toFixed(2) + "%");
    });
  }
  tick();
  setInterval(tick, 1000);

  function confetti() {
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const c = $("confetti"), x = c.getContext("2d");
    const size = () => { c.width = innerWidth; c.height = innerHeight; };
    size(); addEventListener("resize", size);
    const colors = ["#E9DDBE", "#EDEFF4", "#F2B8A0", "#9FC3E8", "#C9B6E4"];
    const bits = Array.from({ length: 180 }, () => ({
      x: Math.random() * c.width, y: -20 - Math.random() * c.height,
      w: 5 + Math.random() * 6, h: 8 + Math.random() * 8,
      vy: 1.5 + Math.random() * 2.5, vx: -1 + Math.random() * 2,
      r: Math.random() * 6, vr: -.1 + Math.random() * .2,
      c: colors[Math.floor(Math.random() * colors.length)]
    }));
    const start = performance.now();
    (function frame(ts) {
      x.clearRect(0, 0, c.width, c.height);
      const loop = ts - start < 8000;
      bits.forEach(b => {
        b.y += b.vy; b.x += b.vx; b.r += b.vr;
        if (b.y > c.height + 20 && loop) { b.y = -20; b.x = Math.random() * c.width; }
        x.save(); x.translate(b.x, b.y); x.rotate(b.r);
        x.fillStyle = b.c; x.fillRect(-b.w / 2, -b.h / 2, b.w, b.h); x.restore();
      });
      if (loop || bits.some(b => b.y < c.height + 20)) requestAnimationFrame(frame);
    })(start);
  }
</script>
</body>
</html>
